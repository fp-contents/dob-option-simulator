<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DOB 옵션 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* 글꼴: 국문 = Pretendard (assets 안에 포함, 한글 글자에만 사용) / 영문·숫자 = Inter */
@font-face{font-family:"Inter Local";src:url("assets/InterVariable-latin.woff2") format("woff2");font-weight:100 900;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}   /* Google Fonts가 막힌 곳용 예비 Inter */
@font-face{font-family:"Pretendard KO";src:url("assets/PretendardVariable-ko.woff2") format("woff2");font-weight:45 920;font-display:swap;
  unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7A3}
/* FP&Co 앱 디자인 키트 v1.0 기준 (색·글꼴·모서리 값은 키트 그대로)
   3D 화면은 밝은 쇼룸이 기준이라 밝은 화면으로 고정합니다. */
:root{color-scheme:light;
  --ink:#0B0B0B; --paper:#FFFFFF; --bg:#F4F4F4; --tile:#EFEFEF; --line:#E3E3E3; --sub:#6E6E6E;
  --up:#0B776C; --down:#D32F2F;
  --sans:"Inter","Inter Local","Pretendard KO",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{display:flex;height:100%}
#viewer{position:relative;flex:1;overflow:hidden;background:var(--paper)}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
#logo{position:absolute;left:28px;top:26px;height:26px;width:auto;display:block;pointer-events:none}
#tools{position:absolute;right:20px;top:24px;display:flex;flex-direction:column;gap:8px}
.tool{width:40px;height:40px;border-radius:4px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0;color:var(--ink)}
.tool:hover{border-color:var(--ink)}
.tool:disabled{color:var(--sub);opacity:.4;cursor:default;border-color:var(--line)}
#copy{position:absolute;right:20px;bottom:20px;margin:0;font-size:11px;line-height:34px;color:var(--sub);letter-spacing:0;pointer-events:none;user-select:none}
#logoLink{position:absolute;left:0;top:0;display:block;width:0;height:0}
#logoLink #logo{pointer-events:auto;cursor:pointer}
#leftbtns{position:absolute;left:20px;bottom:20px;display:flex;gap:8px}
.sbtn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 11px;font-size:13px;min-height:34px;white-space:nowrap}
.sbtn:hover{border-color:var(--ink)}
.sbtn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#panel{width:clamp(340px,28vw,420px);border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.ptop{padding:16px 16px 4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--tile);border-radius:4px;padding:4px}
.seg button{border:0;background:none;border-radius:4px;min-height:38px;font-weight:500;color:var(--sub);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
#opts{flex:1;overflow:auto;padding:0 16px 16px;scrollbar-gutter:stable}   /* 스크롤바 자리를 미리 비워 둬서 내용이 길어져도 폭이 안 바뀜 */
.fl{display:block;font-size:12px;color:var(--sub);margin:16px 4px 8px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:44px;font-weight:500;font-size:14px;padding:6px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink);font-weight:600}
.opt:disabled{opacity:.4;cursor:not-allowed}
.sw{min-height:104px;display:grid;justify-items:center;align-content:center;gap:9px;font-size:12px;word-break:keep-all}
.sw i{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);display:block}
.sw img{width:100%;max-width:72px;height:auto;display:block}
.sw[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink);font-weight:600}
.olist{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 4px}   /* 추가 옵션: 박스 없이 위아래 선만 */
.orow{display:grid;grid-template-columns:32px 1fr;gap:6px;padding:7px 0;font-size:12px;line-height:1.5;color:var(--sub)}
.orow + .orow{border-top:1px solid var(--line)}
.orow b{font-weight:500;color:var(--ink)}
.note{font-size:12px;color:var(--sub);margin:12px 4px 0;word-break:keep-all}
#bottom{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:10px 16px;min-height:44px;font-size:14px;font-weight:500;width:100%}
.btn:hover{border-color:var(--ink)}
.btn.dl{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
#modal{position:fixed;inset:0;background:rgba(11,11,11,.4);display:none;place-items:center;z-index:10;padding:16px}
#modal.show{display:grid}
.box{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:4px;max-height:92vh;overflow:auto;padding:24px}
.box .body{text-align:center}
.box .body.form{text-align:left}
.box p{margin:0;white-space:pre-line;word-break:keep-all}
.box .ttl{font-size:17px;font-weight:600;letter-spacing:-.01em}
.box .hint{font-size:12px;color:var(--sub);margin-top:10px}
.box .acts2{display:grid;gap:8px;margin-top:20px}
.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:10px 14px;min-height:44px;font-size:15px;outline:0}
.field:focus{border-color:var(--ink)}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 4px;padding:8px 8px 8px 18px;border:1px solid var(--line);border-radius:4px;width:fit-content;background:var(--bg)}
.code{font:500 26px/1.2 var(--sans);letter-spacing:.18em}
.copy{width:40px;height:40px;border:1px solid var(--line);background:var(--paper);border-radius:4px;display:grid;place-items:center;padding:0}
.copy:hover{border-color:var(--ink)}
.err{font-size:13px;min-height:21px;margin:10px 4px 0}
.box img{max-width:100%;border:1px solid var(--line);border-radius:4px;margin-top:14px;display:block}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:4px;padding:9px 15px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:11;max-width:90vw;word-break:keep-all}
#toast.show{opacity:1}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);background:var(--paper);font-size:14px}
/* ===== 기성 제품 모드 (옵션 시뮬레이터) — 웹 디자인 키트 v2 값만 사용 ===== */
.phead{padding:16px 4px 0}
.pname{margin:0;font-size:17px;font-weight:600}
.pdim{margin:2px 0 0;font-size:12px;color:var(--sub)}
.sizes{display:grid;gap:8px;margin-top:8px}
.sizes.c1{grid-template-columns:repeat(5,minmax(0,1fr))}
.sizes.c2,.sizes.c3{grid-template-columns:repeat(4,minmax(0,1fr))}
.szb{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 2px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--ink)}
.szb svg{width:100%;height:28px;display:block}
.szb .bd,.szb line{fill:none;stroke:var(--sub);stroke-width:28}
.szb .ft{fill:var(--sub)}
.szb:hover{border-color:var(--ink)}
.szb[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink);font-weight:600}
.szb[aria-pressed="true"] .bd,.szb[aria-pressed="true"] line{stroke:var(--ink)}
.szb[aria-pressed="true"] .ft{fill:var(--ink)}
.prow .fl{display:flex;justify-content:space-between;gap:8px}
.prow .fl b{font-weight:500;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.chip{width:36px;height:36px;padding:0;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.chip i{width:26px;height:26px;border-radius:999px;display:block;border:1px solid var(--line)}
.chip i.nodoor{background:linear-gradient(135deg,transparent 47%,var(--sub) 48% 52%,transparent 53%),var(--paper)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.hgrid{display:grid;gap:8px}
.opt.hb{min-height:44px;padding:0 6px}
.orow.one{grid-template-columns:1fr}
.box .olist{margin:14px 0 0;text-align:left}
@media (max-width:820px), (max-aspect-ratio:1/1) and (max-width:1100px){   /* 기성 제품 · 모바일: 키트 반응형 위에 덧붙임 */
  body.preset #bottom{grid-template-columns:1fr 1.25fr}
  body.preset .phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:12px}
  body.preset .pdim{margin:0}
  body.preset .chip{width:40px;height:40px}
  body.preset .chip i{width:29px;height:29px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.copy-m{display:none}
/* ===== 모바일·세로 화면: 위 3D / 아래 옵션 패널 ===== */
@media (max-width:820px), (max-aspect-ratio:1/1) and (max-width:1100px){
  #app{flex-direction:column;height:100vh;height:100dvh}
  #viewer{flex:none;height:52vh;height:52svh;min-height:300px}
  .logo-flatpoint,#logo{height:14px;left:20px;top:calc(22px + env(safe-area-inset-top))}
  #tools{flex-direction:row;right:16px;top:calc(14px + env(safe-area-inset-top));gap:6px}   /* 도구 버튼: 위쪽 가로줄 */
  .tool{width:34px;height:34px}
  .tool svg.i{width:18px;height:18px}
  #leftbtns{left:20px;right:20px;bottom:14px;gap:6px;overflow-x:auto;scrollbar-width:none}
  #leftbtns::-webkit-scrollbar{display:none}
  .sbtn{font-size:12px;min-height:30px;padding:4px 10px;flex:none}
  #copy{display:none}
  #panel{width:auto;flex:1;min-height:0;border-left:0;border-top:1px solid var(--line)}
  .ptop{padding:14px 20px 2px}
  .seg button{min-height:34px;font-size:13px}
  #opts{padding:0 20px 12px}
  .fl{margin:12px 4px 6px}
  .opt{min-height:40px;font-size:13px}
  .sw{min-height:84px;gap:7px;font-size:11px}
  .sw i{width:30px;height:30px}
  .sw img{max-width:56px}
  #bottom{grid-template-columns:1fr 1fr 1.25fr;gap:6px;padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
  .two{display:contents}
  .btn{min-height:42px;padding:8px 6px;font-size:13px}
  .copy-m{display:block;grid-column:1/-1;margin:2px 0 0;text-align:center;font-size:10px;color:var(--sub)}
  #toast{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
  .box{padding:20px}
}
</style>
</head>

function fit(angled){
  const {W,H,D} = layout, d=D*MM;
  const x0 = -G.gapLeft-60, x1 = W+G.arrowGap+G.arrowH, y1 = H+G.gapTop+70;   // 치수·화살표까지 포함한 범위
  const w=(x1-x0)*MM, h=y1*MM;
  const ctr = new THREE.Vector3((x0+x1)/2*MM, h/2 + (viewer.clientWidth < 600 ? h*0.04 : 0), d/2);
  const vf = THREE.MathUtils.degToRad(camera.fov), asp = camera.aspect;
  const narrow = viewer.clientWidth < 600, mh = narrow ? 1.8 : 1.45, mw = narrow ? 1.5 : 1.3;   // 모바일은 위 도구줄·아래 버튼줄 자리를 더 비움
  const dist = Math.max((h*mh)/(2*Math.tan(vf/2)), (w*mw)/(2*Math.tan(vf/2)*asp)) + d;
  const dir = angled==='keep' ? camera.position.clone().sub(controls.target).normalize()   // 보고 있던 각도 유지
            : angled ? new THREE.Vector3(.22,.16,1).normalize() : new THREE.Vector3(0,.08,1).normalize();
  camera.position.copy(ctr).addScaledVector(dir, Math.max(dist,1.1)); controls.target.copy(ctr); controls.update();
}
function zoom(f){ const v = camera.position.clone().sub(controls.target).multiplyScalar(f); const len=v.length();
  if (len<controls.minDistance||len>controls.maxDistance) return; camera.position.copy(controls.target).add(v); }
function resize(){ const w=viewer.clientWidth, h=viewer.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  const d = renderer.getDrawingBufferSize(new THREE.Vector2()); maskRT.setSize(d.x, d.y); edgeMat.uniforms.px.value.set(1/d.x, 1/d.y); edgeMat.uniforms.w.value = CFG.selLine*renderer.getPixelRatio(); }

/* ⑥ 치수선·추가 화살표 — 원본처럼 3D 공간 안에 놓여 모델과 함께 회전 */
const G = { text: 20, textGap: 16, gapTop: 150, gapLeft: 190, arrowW: 125, arrowH: 49, arrowGap: 50 };   // mm 단위
const matDim = new THREE.LineBasicMaterial({ color:'#333333' });
let tmpTex = [];
function textTex(lines){                       // 글자를 그림(텍스처)으로 — 영문 설명은 얇게(300), 숫자+mm는 기존 굵기(500)
  const fs = Math.round(CFG.dimTextPx * Math.max(1, renderer.getPixelRatio()) * 2), lh = fs*1.25, cv = document.createElement('canvas'), g = cv.getContext('2d');   // 화면 크기에 맞춘 해상도(흐림 방지)
  const FONT = wt => `${wt} ${fs}px Inter, Arial, sans-serif`;
  const segs = l => l.split(/([\d,.]+(?: · [\d,.]+)* mm)/).filter(Boolean).map(s=>[s, /^[\d,]/.test(s) ? 500 : 300]);
  const width = l => segs(l).reduce((a,[s,wt])=>{ g.font = FONT(wt); return a + g.measureText(s).width; }, 0);
  const w = Math.ceil(Math.max(...lines.map(width))) + 8;
  cv.width = w; cv.height = Math.ceil(lh*lines.length);
  g.fillStyle = '#2b2b2b'; g.textAlign = 'left'; g.textBaseline = 'middle';
  lines.forEach((l,i)=>{ let x = (w - width(l))/2; segs(l).forEach(([s,wt])=>{ g.font = FONT(wt); g.fillText(s, x, lh*(i+.5)); x += g.measureText(s).width; }); });
  const tx = new THREE.CanvasTexture(cv); tx.generateMipmaps = false; tx.minFilter = THREE.LinearFilter; tx.anisotropy = 4; tmpTex.push(tx);   // 얇은 획(숫자 1 등)이 흐려지지 않게
  return { tx, aspect: cv.width/cv.height, n: lines.length };
}
function textMesh(lines, x, y, z, rotZ, anchor, gap=0){   // gap: 치수선과 글자 사이(글자와 함께 커지고 작아짐)   // anchor: 아래쪽(0) 기준으로 붙이기
  const { tx, aspect, n } = textTex(lines), h = G.text*1.25*n;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(h*aspect*MM, h*MM), new THREE.MeshBasicMaterial({ map:tx, transparent:true, depthWrite:false, depthTest:false, side:THREE.DoubleSide }));   // 바닥에 가려지지 않게
  m.position.set(x*MM, y*MM, z*MM); m.rotation.z = rotZ||0; m.renderOrder = 4;
  if (anchor) m.translateY((h/2+gap)*MM);
  m.userData.base = new THREE.Vector3(x*MM, y*MM, z*MM); m.userData.len = h*aspect; dimTexts.push(m);   // 기준점(글자 크기를 바꿔도 이 점에 붙어 있음)
  root.add(m); return m;
}
// 치수 글자는 확대·축소와 상관없이 화면에서 항상 같은 크기(CFG.dimTextPx)로 보이게
let dimTexts = [], lightTags = [];
function lightTag(label, col){                    // 작은 점(색온도별 색) + 색온도 글자, 미니멀한 표
  const k = 4, fs = 9.5*k, padX = 5*k, dot = 5*k, gap = 3.5*k, H = 14*k, cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = `500 ${fs}px Inter, Arial, sans-serif`; g.font = font; const tw = g.measureText(label).width;
  cv.width = Math.ceil(padX*2 + dot + gap + tw); cv.height = H;
  g.fillStyle = 'rgba(11,11,11,.72)'; const r = H/2; g.beginPath(); g.moveTo(r,0); g.arcTo(cv.width,0,cv.width,H,r); g.arcTo(cv.width,H,0,H,r); g.arcTo(0,H,0,0,r); g.arcTo(0,0,cv.width,0,r); g.fill();
  g.fillStyle = col; g.beginPath(); g.arc(padX + dot/2, H/2, dot/2, 0, Math.PI*2); g.fill();
  g.font = font; g.fillStyle = '#ffffff'; g.textBaseline = 'middle'; g.fillText(label, padX + dot + gap, H/2 + 0.3*k);
  const tx = new THREE.CanvasTexture(cv); tx.encoding = THREE.sRGBEncoding; tx.anisotropy = 4; tmpTex.push(tx);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tx, depthTest:false, depthWrite:false, transparent:true }));
  sp.material.userData.tmp = true; sp.center.set(1, 1); sp.renderOrder = 6; sp.userData.aspect = cv.width/cv.height; return sp;
}
const _v = new THREE.Vector3(), _dir = new THREE.Vector3();
function updateDimText(){
  camera.getWorldDirection(_dir);
  const k = viewer.clientHeight / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  lightTags.forEach(sp=>{ if (!sp.visible) return; const d = Math.max(0.01, _v.copy(sp.position).sub(camera.position).dot(_dir)), hw = CFG.tagPx*d/k; sp.scale.set(hw*sp.userData.aspect, hw, 1); });
  dimTexts.forEach(m=>{
    const u = m.userData; if (!u.off) u.off = m.position.clone().sub(u.base);   // 처음 놓인 위치와 기준점의 거리
    const d = Math.max(0.01, _v.copy(u.base).sub(camera.position).dot(_dir));
    let s = CFG.dimTextPx / (G.text*MM * k / d);
    m.scale.setScalar(s); m.position.copy(u.base).addScaledVector(u.off, s);
  });
}
function line(pts){ const g = new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0]*MM,p[1]*MM,p[2]*MM))); root.add(new THREE.Line(g, matDim)); }
function arrowMesh(k){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(G.arrowW*MM, G.arrowH*MM), new THREE.MeshBasicMaterial({ map:arrowTex, transparent:true, depthWrite:false, side:THREE.DoubleSide }));
  m.userData = { type:'add', k }; m.renderOrder = 3; pickables.push(m); root.add(m); return m;
}
// 내경: 1칸이면 기존 표기, 2칸 이상이면 '한 칸 기준'으로 읽히게 / module 표기 (크기가 섞이면 작은 값부터 나열)
const innerLabel = arr => { const v = uniq(arr).map(x=>x.toLocaleString('en'));
  return arr.length===1 ? 'Inside dimension '+v[0]+' mm' : 'Inside dimension '+v.join(' · ')+' mm / module'; };
function addGuides(){
  const { W, H, D } = layout, z = D;   // 원본처럼 앞면 기준
  // 가로 치수 (위쪽, 뒤판 높이)
  const yL = H + G.gapTop;
  line([[0,yL,z],[W,yL,z]]); line([[0,yL-14,z],[0,yL+14,z]]); line([[W,yL-14,z],[W,yL+14,z]]);
  const hl = ['Dimension '+Math.round(W).toLocaleString('en')+' mm'];
  textMesh(hl, W/2, yL, z, 0, true, G.textGap);
  // 세로 치수 (왼쪽)
  const xL = -G.gapLeft;
  const yB = -CFG.footH;                         // 발캡 바닥부터 (발캡 포함 높이)
  line([[xL,yB,z],[xL,H,z]]); line([[xL-14,yB,z],[xL+14,yB,z]]); line([[xL-14,H,z],[xL+14,H,z]]);
  const vl = ['Dimension '+Math.round(H+CFG.footH).toLocaleString('en')+' mm'];
  const vt = textMesh(vl, xL, (H+yB)/2, z, Math.PI/2, false); const vh = G.text*1.25*vl.length; vt.position.x -= (vh/2+G.textGap)*MM;
  if (PRESET) return;                              // 기성 제품: 칸 추가 화살표 없음
  // 칸 추가 화살표: 좌우는 정면을 향해 서 있고, 위쪽은 윗면에 누워 있음
  const l = arrowMesh('left');  l.position.set((-G.arrowGap)*MM, H/2*MM, D*MM); l.rotation.z =  Math.PI/2;
  const r = arrowMesh('right'); r.position.set((W+G.arrowGap)*MM, H/2*MM, D*MM); r.rotation.z = -Math.PI/2;
  const t = arrowMesh('top');   t.position.set(W/2*MM, (H+G.arrowH/2+22)*MM, D*MM);   // 완전히 수직으로 서 있음
}

/* ⑦ 구성 바꾸기 */
function addAt(k){
  if (k==='top'){
    if (S.rows.length>=CFG.maxRows) return toast(t('maxRow'));
    S.rows.push(S.rows[S.rows.length-1]); S.cells.push(S.cols.map(blank));
  } else {
    if (S.cols.length>=CFG.maxCols) return toast(t('maxCol'));
    if (k==='left'){ S.cols.unshift(S.cols[0]); S.cells.forEach(row=>row.unshift(blank())); S.open=shiftOpen(0,1); S.sels.forEach(s=>s.c++); }
    else { S.cols.push(S.cols[S.cols.length-1]); S.cells.forEach(row=>row.push(blank())); }
  }
  refresh(true);
}
function shiftOpen(dr,dc){ const o={}; Object.keys(S.open).forEach(k=>{ const [r,c]=k.split(',').map(Number); o[(r+dr)+','+(c+dc)]=S.open[k]; }); return o; }
function delRow(){                            // 선택된 칸이 있는 행을 모두 삭제
  if(!S.sels.length) return; const rs = uniq(S.sels.map(s=>s.r));
  if(S.rows.length-rs.length<1) return toast(t('lastRow'));
  rs.reverse().forEach(r=>{ S.rows.splice(r,1); S.cells.splice(r,1); }); S.open={}; select(null); refresh(true); }
function delCol(){                            // 선택된 칸이 있는 열을 모두 삭제
  if(!S.sels.length) return; const cs = uniq(S.sels.map(s=>s.c));
  if(S.cols.length-cs.length<1) return toast(t('lastCol'));
  cs.reverse().forEach(c=>{ S.cols.splice(c,1); S.cells.forEach(row=>row.splice(c,1)); }); S.open={}; select(null); refresh(true); }
function setSize(kind, v){                    // 선택된 칸들의 열(가로) 또는 행(높이)에 한꺼번에 적용
  if (!S.sels.length) return toast(t('pick'));
  const lines = uniq(S.sels.map(s=>kind==='w'?s.c:s.r)).filter(i=>(kind==='w'?S.cols[i]:S.rows[i])!==v);
  if (!lines.length) return;
  const bad = [];
  lines.forEach(i=>{ if (kind==='w') S.rows.forEach((h,ri)=>{ if(!cellOK(S.cells[ri][i],v,h)) bad.push([ri,i]); });
                     else S.cols.forEach((w,ci)=>{ if(!cellOK(S.cells[i][ci],w,v)) bad.push([i,ci]); }); });
  const apply = ()=>{ bad.forEach(([ri,ci])=>{ S.cells[ri][ci].door='none'; S.cells[ri][ci].hole='none'; delete S.open[ri+','+ci]; });
    lines.forEach(i=>{ if (kind==='w') S.cols[i]=v; else { S.rows[i]=v; if (CFG.noBack.includes(v)) S.cells[i].forEach(x=>x.hole='none'); } }); refresh(true); };
  if (bad.length) dialog({ msg:t('conflict'), hint:t('conflictHint'), cancel:true, onOk:apply }); else apply();
}
function setOpt(key, id){                     // 선택된 모든 칸에 일괄 적용 (조건이 안 맞는 칸은 건너뜀)
  if (!S.sels.length) return toast(t('pick'));
  const special = (key==='door' && id!=='none') || (key==='hole' && (CFG.holes.find(o=>o.id===id)||{}).special);
  let done = 0, skip = 0;
  S.sels.forEach(({r,c})=>{
    if (special && !isSpecial(S.cols[c], S.rows[r])) { skip++; return; }
    if (key==='hole' && id!=='none' && CFG.noBack.includes(S.rows[r])) { skip++; return; }   // 뒷판 없는 칸은 타공 불가
    S.cells[r][c][key] = id; done++; if (key==='door' && id==='none') delete S.open[r+','+c];
  });
  if (!done) return toast(key==='door' ? t('doorOnly') : S.sels.every(s=>CFG.noBack.includes(S.rows[s.r])) ? t('noBackHole') : t('sqOnly'));
  if (skip) toast(t('skipped').replace('{n}', skip));
  refresh(false);
}
function refresh(refit){ build(); renderPanel(); if (refit) fit('keep'); }

/* ⑧ 오른쪽 패널 */
const tabs = document.getElementById('tabs'), opts = document.getElementById('opts');
// 추가 옵션 요약: 위치는 왼쪽 아래 칸부터 '행-열' (1-1, 1-2 … 2-1)
function optionRows(){
  const out = [];
  S.rows.forEach((hh,r)=>S.cols.forEach((ww,c)=>{ const x = S.cells[r][c], parts = [];
    if (x.door!=='none') parts.push(t('door')+' '+L(CFG.doors.find(o=>o.id===x.door)));
    if (x.light!=='none') parts.push(t('light')+' '+L(CFG.lights.find(o=>o.id===x.light)));
    if (x.hole!=='none') parts.push(L(CFG.holes.find(o=>o.id===x.hole)));
    if (parts.length) out.push({ pos:(r+1)+'-'+(c+1), size:'W'+ww+' × H'+hh, parts });
  }));
  return out;
}
function renderPanel(){
  if (PRESET) return renderPreset();
  tabs.innerHTML = ['size','door','light','hole'].map(k=>`<button type="button" aria-pressed="${S.tab===k}" data-tab="${k}">${t(k)}</button>`).join('');
  const list = S.sels.map(s=>({ ...s, cell:S.cells[s.r][s.c], w:S.cols[s.c], h:S.rows[s.r] }));
  const sel = list.length > 0, n = list.length;
  const same = f => sel && list.every(x=>f(x)===f(list[0])) ? f(list[0]) : null;   // 모두 같을 때만 선택 표시
  const w = same(x=>x.w), h = same(x=>x.h);
  const cell = { door:same(x=>x.cell.door), light:same(x=>x.cell.light), hole:same(x=>x.cell.hole) };
  const spN = list.filter(x=>isSpecial(x.w,x.h)).length, sp = spN > 0;
  const partNote = (k) => sel && spN < n ? `<p class="note">${spN ? t('partly').replace('{a}', n).replace('{b}', spN) : t(k)}</p>` : '';
  const sizes = (arr, cur, act) => `<div class="opts">${arr.map(v=>`<button type="button" class="opt" aria-pressed="${cur===v}" data-act="${act}" data-v="${v}">${v}</button>`).join('')}</div>`;
  const pickNote = sel ? '' : `<p class="note">${t('pick')}</p>`;
  const head = n > 1 ? `<p class="note" style="margin-top:14px">${t('selCount').replace('{n}', n)}</p>` : '';
  let html = '';
  if (S.tab==='size'){
    html = `<label class="fl">${t('w')}</label>${sizes(CFG.widths, w, 'w')}<label class="fl">${t('h')}</label>${sizes(CFG.heights, h, 'h')}<label class="fl">${t('d')}</label>${sizes(CFG.depths, sel?CFG.depths[0]:null, 'd')}${pickNote}`;
    const rows = optionRows();
    html += `<label class="fl" style="margin-top:28px">${t('extra')}</label>` + (rows.length
      ? `<div class="olist">${rows.map(o=>`<div class="orow"><b>${o.pos}</b><span>${o.parts.join(' · ')}</span></div>`).join('')}</div>`
      : `<p class="note">${t('noExtra')}</p>`);
  } else if (S.tab==='door'){
    html = `<label class="fl">${t('doorColor')}</label><div class="opts">${CFG.doors.map(o=>`<button type="button" class="opt sw" aria-pressed="${cell.door===o.id}" data-act="door" data-v="${o.id}" ${sel&&!sp&&o.id!=='none'?'disabled':''}>${o.c?`<i style="background:${o.c}"></i>`:o.tex?`<i style="background:url(${WOOD_URL}) center/cover"></i>`:''}${L(o)}</button>`).join('')}</div>${partNote('doorOnly')||pickNote}`;
  } else if (S.tab==='light'){
    html = `<label class="fl">${t('lightTemp')}</label><div class="opts">${CFG.lights.map(o=>`<button type="button" class="opt sw" aria-pressed="${cell.light===o.id}" data-act="light" data-v="${o.id}">${o.sw?`<i style="background:radial-gradient(circle at 50% 45%,#fff 0,${o.sw} 70%)"></i>`:''}${L(o)}</button>`).join('')}</div>${pickNote}`;
  } else {
    const nb = sel && list.every(x=>CFG.noBack.includes(x.h));   // 모두 뒷판 없는 칸(H138)
    html = `<label class="fl">${t('holeType')}</label><div class="opts">${CFG.holes.map(o=>{ const dis = sel && o.special && !sp;
      const ic = o.id==='none' ? '' : `<img src="data:image/png;base64,${o.id==='round'?A.tex.holeRound:A.tex.holeSquare}" alt="">`;
      return `<button type="button" class="opt sw" aria-pressed="${cell.hole===o.id}" data-act="hole" data-v="${o.id}" ${dis||(nb&&o.id!=='none')?'disabled':''}>${ic}${L(o)}</button>`; }).join('')}</div>${nb?`<p class="note">${t('noBackHole')}</p>`:partNote('sqOnly')||pickNote}`;
  }
  opts.innerHTML = head + html;
  document.getElementById('save').textContent = t('save'); document.getElementById('load').textContent = t('load');
  const bl = document.getElementById('bLang'); bl.textContent = t('lang');
  document.getElementById('bReset').textContent = t('reset'); document.getElementById('bHole').textContent = t('showHole'); document.getElementById('bLight').textContent = t('showLight'); document.getElementById('bCap').textContent = t('cap');
}
/* ⑧-2 기성 제품 패널: 사이즈 구성 → 단별 도어 색 → 아크릴 타공 → 선택한 옵션 */
function sizeIcon(id){                           // 모델 이름으로 실제 비율의 정면 도면을 자동으로 그림(같은 축척)
  const n = Number(id[0]), hs = CFG.preset.heights[id.slice(1)], CW = 718, FR = 12, FT = 13;
  const W = CW*n + FR, Hb = hs.reduce((a,h)=>a+h+FR,0) + FR, H = Hb + FT, VW = 2300, VH = 1160;
  let y = Hb, l = '', ft = '';
  hs.slice(0,-1).forEach(h=>{ y -= h+FR; l += `<line x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; });
  for (let i=1;i<n;i++) l += `<line x1="${i*CW+FR/2}" x2="${i*CW+FR/2}" y1="0" y2="${Hb}"/>`;
  for (let i=0;i<n;i++) ft += `<rect class="ft" x="${i*CW+50}" y="${Hb}" width="44" height="${FT}"/><rect class="ft" x="${i*CW+CW-84}" y="${Hb}" width="44" height="${FT}"/>`;
  return `<svg viewBox="${(W-VW)/2} ${H-VH} ${VW} ${VH}" aria-hidden="true"><rect class="bd" x="0" y="0" width="${W}" height="${Hb}" rx="10"/>${l}${ft}</svg>`;
}
const sumRows = () => [...doorRows().slice().reverse().map(r=>optLabel(r)), holeLabel()].map(x=>{ const i = x.indexOf(' : '); return `<div class="orow one"><span><b>${x.slice(0,i)}</b>${x.slice(i)}</span></div>`; }).join('');

    const cur = S.cells[r][0].door;
    html += `<section class="prow" data-row="${r}"><label class="fl"><span>${tierName(r)}</span><b>${L(rowDoor(r))}</b></label><div class="chips">${modelDoors().map(o=>
      `<button type="button" class="chip" title="${L(o)}" aria-label="${tierName(r)} ${L(o)}" aria-pressed="${cur===o.id}" data-act="rdoor" data-r="${r}" data-v="${o.id}">${o.c?`<i style="background:${o.c}"></i>`:'<i class="nodoor"></i>'}</button>`).join('')}</div></section>`;
  });
  html += `<label class="fl">${t('holeT')}</label><div class="hgrid" style="grid-template-columns:repeat(${S.cols.length},minmax(0,1fr))">`;
  doorRows().slice().reverse().forEach(r=>S.cols.forEach((_,c)=>{
    html += `<button type="button" class="opt hb" aria-pressed="${S.cells[r][c].hole==='round'}" data-act="phole" data-r="${r}" data-c="${c}">${tierNo(r)}-${c+1}</button>`; }));
  html += `</div><p class="note">${t('holeN')}</p>`;
  html += `<label class="fl" style="margin-top:28px">${t('sum')}</label><div class="olist">${sumRows()}</div>`;
  opts.innerHTML = html;
  document.getElementById('save').textContent = t('cart'); document.getElementById('bCap').textContent = t('cap');
  document.getElementById('bLang').textContent = t('lang'); document.getElementById('bReset').textContent = t('reset'); document.getElementById('bHole').textContent = t('showHole');
}
function setRowDoor(r, id){ if (S.rows[r]!==CFG.special.h) return toast(t('doorOnly')); S.cells[r].forEach((x,c)=>{ x.door = id; if (id==='none') delete S.open[r+','+c]; }); selRow(r); refresh(false); }
function toggleHole(r, c){                       // 타공을 켜면 그 칸 도어가 열려 타공이 보임 (3D에서 도어를 누르면 닫힘)
  if (CFG.noBack.includes(S.rows[r])) return toast(t('noBackHole'));
  const x = S.cells[r][c], key = r+','+c; x.hole = x.hole==='round' ? 'none' : 'round';
  if (x.hole==='round' && x.door!=='none'){ const o = S.open[key] || (S.open[key] = { a:0, to:0 }); o.to = 1; }
  refresh(false);
}
function sendCart(){                             // 상세페이지(부모 창)로 구성 전달 → 상세페이지가 카페24 옵션 자동 선택·장바구니 담기
  const p = CFG.preset.products[S.model] || {};
  const data = { source:'dob-preset', action:'cart', model:'DOB '+S.model, productNo:p.no||null,
    doors: doorRows().slice().reverse().map(r=>({ tier:tierNo(r), name:tierName(r,'ko'), value:optValue(r), id:S.cells[r][0].door })),
    holes: holeList() };
  if (EMBED){ window.parent.postMessage(data, '*'); toast(t('cartGo')); return data; }
  dialog({ html:`<p class="ttl">${t('cartT')} · DOB ${S.model}</p><div class="olist">${sumRows()}</div><p class="hint">${t('cartHint')}</p>` });
  return data;
}
tabs.addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b){ S.tab=b.dataset.tab; renderPanel(); } });
opts.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v;
  if (PRESET){
    if (a==='model'){ if (v!==S.model){ applyPreset(v); refresh(false); fit(true); } }
    else if (a==='rdoor') setRowDoor(Number(b.dataset.r), v);
    else if (a==='phole') toggleHole(Number(b.dataset.r), Number(b.dataset.c));
    return;
  }
  if (a==='w'||a==='h') setSize(a, Number(v)); else if (a==='d') {} else setOpt(a, v); });

/* ⑨ 3D 클릭: 칸 선택, 도어 열고 닫기 */
const ray = new THREE.Raycaster(); let down = null;
renderer.domElement.tabIndex = 0; renderer.domElement.style.outline = 'none';
renderer.domElement.addEventListener('pointerdown', e=>{ down = { x:e.clientX, y:e.clientY }; renderer.domElement.focus({preventScroll:true}); });
renderer.domElement.addEventListener('pointerup', e=>{
  if (!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 5) return; down = null;
  const rc = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({ x:(e.clientX-rc.left)/rc.width*2-1, y:-(e.clientY-rc.top)/rc.height*2+1 }, camera);
  const hits = ray.intersectObjects(pickables, false);
  const hit = hits.find(x=>x.object.userData.type!=='cell') || hits[0];   // 도어·화살표를 칸보다 먼저
  const multi = e.ctrlKey || e.metaKey, range = e.shiftKey;
  if (!hit){ if (!multi && !range){ select(null); build(); renderPanel(); } return; }
  if (hit.object.userData.type==='add') return addAt(hit.object.userData.k);
  if (PRESET){                                  // 기성 제품: 칸을 누르면 그 줄 전체 선택, 도어를 누르면 열고 닫기
    const { type, r } = hit.object.userData, key = r+','+hit.object.userData.c;
    if (type==='door'){ const o = S.open[key] || (S.open[key] = { a:0, to:0 }); o.to = o.to ? 0 : 1; }
    selRow(r); build(); renderPanel();
    const sec = opts.querySelector(`[data-row="${r}"]`); if (sec) sec.scrollIntoView({ block:'nearest', behavior:'smooth' });
    return;
  }
  const { type, r, c } = hit.object.userData, key = r+','+c;
  if (range && S.sel){                          // Shift+클릭: 기준 칸부터 누른 칸까지 사각 영역
    const r0=Math.min(S.sel.r,r), r1=Math.max(S.sel.r,r), c0=Math.min(S.sel.c,c), c1=Math.max(S.sel.c,c);
    S.sels = []; for (let i=r0;i<=r1;i++) for (let j=c0;j<=c1;j++) S.sels.push({r:i,c:j});
    build(); renderPanel(); return;
  }
  if (multi){                                   // Ctrl(⌘)+클릭: 한 칸씩 더하거나 빼기
    if (isSel(r,c)){ S.sels = S.sels.filter(s=>!(s.r===r&&s.c===c)); S.sel = S.sels[S.sels.length-1] || null; }
    else { S.sels.push({r,c}); S.sel = {r,c}; }
    build(); renderPanel(); return;
  }
  const already = S.sels.length===1 && isSel(r,c);   // 첫 클릭은 선택만, 선택된 칸을 한 번 더 누르면 도어 열기/닫기
  if (!already){ select({ r, c }); build(); renderPanel(); return; }
  if (S.cells[r][c].door!=='none' && (type==='door' || (S.open[key] && S.open[key].to))){ const o = S.open[key] || (S.open[key] = { a:0, to:0 }); o.to = o.to ? 0 : 1; }
});

renderer.domElement.addEventListener('pointermove', e=>{
  if (e.buttons) return; const rc = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({ x:(e.clientX-rc.left)/rc.width*2-1, y:-(e.clientY-rc.top)/rc.height*2+1 }, camera);
  const hit = ray.intersectObjects(pickables, false)[0]; renderer.domElement.style.cursor = hit ? 'pointer' : '';
});

/* ⑩ 대화상자·알림 */
const modal = document.getElementById('modal'), mbox = document.getElementById('mbox');
function closeModal(){ modal.classList.remove('show'); mbox.innerHTML=''; }
function dialog({ msg, hint, cancel, onOk, html }){
  mbox.innerHTML = `<div class="body">${html||`<p>${msg}</p>`}${hint?`<p class="hint">${hint}</p>`:''}</div><div class="acts2"><button type="button" class="btn primary ok">${t('ok')}</button>${cancel?`<button type="button" class="btn no">${t('cancel')}</button>`:''}</div>`;
  mbox.querySelector('.ok').onclick = ()=>{ closeModal(); onOk && onOk(); };
  if (cancel) mbox.querySelector('.no').onclick = closeModal;
  modal.classList.add('show');
}
let tt; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }

/* ⑪ 설정 저장·불러오기 (코드 방식) */
const serial = () => ({ v:1, cols:S.cols, rows:S.rows, cells:S.cells });
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 0/O, 1/I 제외
const newCode = () => Array.from({length:6}, ()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const store = {
  async save(design){
    if (CFG.API){ const r = await fetch(CFG.API+'/api/save',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ design }) }); if(!r.ok) throw 0; return (await r.json()).code; }
    const all = JSON.parse(localStorage.getItem('dob-saves')||'{}'); let code; do { code = newCode(); } while (all[code]);
    all[code] = { design, at:Date.now() }; localStorage.setItem('dob-saves', JSON.stringify(all)); return code;
  },
  async load(code){
    if (CFG.API){ const r = await fetch(CFG.API+'/api/load/'+encodeURIComponent(code)); if(r.status===404) return null; if(!r.ok) throw 0; return (await r.json()).design; }
    const all = JSON.parse(localStorage.getItem('dob-saves')||'{}'); return all[code] ? all[code].design : null;
  }
};
const COPY_ICON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="12" rx="1.5"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 5v10A1.5 1.5 0 0 0 6 16.5h2.5"/></svg>';
async function openSave(){
  let code;
  try { code = await store.save(serial()); } catch(e){ return toast(t('fail')); }
  dialog({ html:`<p class="ttl">${t('saved')}</p><div class="codebox"><span class="code">${code}</span><button class="copy" type="button" aria-label="${t('copy')}" title="${t('copy')}">${COPY_ICON}</button></div><p class="hint">${t('savedHint')}</p>` });
  mbox.querySelector('.copy').onclick = async ()=>{
    try { await navigator.clipboard.writeText(code); toast(t('copied')); }
    catch(e){ const r = document.createRange(); r.selectNodeContents(mbox.querySelector('.code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('copyFail')); }
  };
}
function openLoad(){
  mbox.innerHTML = `<div class="body form"><p class="ttl">${t('load')}</p><p class="hint" style="margin-top:4px">${t('loadT')}</p>
    <label class="fl" for="lCode">${t('code')}</label><input class="field" type="text" id="lCode" autocomplete="off" maxlength="6" style="text-transform:uppercase;letter-spacing:.18em;font-family:var(--sans)"><div class="err" id="lErr" role="alert"></div></div>
    <div class="acts2"><button type="button" class="btn primary ok">${t('ok')}</button><button type="button" class="btn no">${t('cancel')}</button></div>`;
  modal.classList.add('show');
  const inp = mbox.querySelector('#lCode'); inp.focus();
  mbox.querySelector('.no').onclick = closeModal;
  mbox.querySelector('.ok').onclick = async ()=>{
    const err = mbox.querySelector('#lErr'), code = inp.value.trim().toUpperCase();
    if (code.length!==6) return err.textContent = t('needCode');
    try { const d = await store.load(code);
      if (!d) return err.textContent = t('notFound');
      S.cols=d.cols; S.rows=d.rows; S.cells=d.cells; select(null); S.open={}; closeModal(); refresh(true); toast(t('loaded'));
    } catch(e){ err.textContent = t('fail'); }
  };
}

/* ⑫ 이미지 캡쳐: 3D 화면(치수 포함) + 로고를 한 장으로 */
function capture(){
  const prev = [S.sel, S.sels]; S.sels = []; build(); Object.values(holeMarks).forEach(m=>m.visible=false); lightTags.forEach(s=>s.visible=false); updateDimText(); renderer.render(scene, camera);   // 선택 테두리 없이 촬영
  const W = renderer.domElement.width, H = renderer.domElement.height, k = W/viewer.clientWidth;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H; const g = cv.getContext('2d');
  // 아래쪽에 추가 옵션 기록 (위치: 왼쪽 아래 칸부터 1-1, 1-2 …)
  const rows = optionRows(), pad = 28*k, lh2 = 20*k, colW = 330*k, cols = Math.max(1, Math.floor((W-pad*2)/colW));
  const F = (wt, px) => `${wt} ${px*k}px Inter, "Pretendard KO", Arial, sans-serif`;
  if (PRESET){                                   // 기성 제품: 모델명·사이즈 + 단별 도어 + 타공을 아래에 기록
    const Lo = layout || computeLayout(), f = v => v.toLocaleString('en');
    const lines = [...doorRows().slice().reverse().map(r=>optLabel(r)), holeLabel()];
    const pH = pad*0.9 + 22*k + 14*k + lines.length*lh2 + pad*0.8;
    cv.height = H + pH; g.fillStyle = '#ffffff'; g.fillRect(0,0,W,cv.height);
    g.drawImage(renderer.domElement,0,0); const lg0 = document.getElementById('logo'), lh0 = 26*k; g.drawImage(lg0, 28*k, 26*k, lh0*lg0.naturalWidth/lg0.naturalHeight, lh0);
    g.fillStyle = '#e3e3e3'; g.fillRect(pad, H, W-pad*2, Math.max(1, k));
    g.textBaseline = 'top'; let y = H + pad*0.9;
    const name = 'DOB ' + S.model; g.fillStyle = '#0b0b0b'; g.font = F(600, 16); g.fillText(name, pad, y);
    const nw = g.measureText(name).width; g.font = F(300, 12); g.fillStyle = '#6e6e6e';
    g.fillText(`W ${f(Lo.W)} × H ${f(Lo.H+CFG.preset.feet)} × D ${CFG.depths[0]} mm`, pad + nw + 12*k, y + 3.5*k);
    y += 22*k + 14*k;
    lines.forEach(x=>{ const i = x.indexOf(' : '), a = i<0 ? x : x.slice(0,i), b = i<0 ? '' : x.slice(i);
      g.font = F(600, 12); g.fillStyle = '#0b0b0b'; g.fillText(a, pad, y); const aw = g.measureText(a).width;
      g.font = F(400, 12); g.fillStyle = '#2b2b2b'; g.fillText(b, pad + aw, y); y += lh2; });
    const url0 = cv.toDataURL('image/png'); [S.sel, S.sels] = prev; build();
    dialog({ html:`<p class="ttl">${t('capT')}</p><img src="${url0}" alt="capture"><p class="hint">${t('capHint')}</p><p style="margin-top:16px"><a class="btn primary dl" href="${url0}" download="flatpoint-dob-${S.model}.png">${t('down')}</a></p>` });
    mbox.querySelector('.ok').classList.remove('primary'); mbox.querySelector('.acts2').style.marginTop = '8px';
    return;
  }
  const extraH = rows.length ? pad + 22*k + Math.ceil(rows.length/cols)*lh2 + pad*0.8 : 0;
  cv.height = H + extraH; g.fillStyle = '#ffffff'; g.fillRect(0,0,W,cv.height);
  g.drawImage(renderer.domElement,0,0); const lg = document.getElementById('logo'); const lh = 26*k; g.drawImage(lg, 28*k, 26*k, lh*lg.naturalWidth/lg.naturalHeight, lh);   // 원본 로고 이미지
  if (rows.length){
    g.fillStyle = '#e3e3e3'; g.fillRect(pad, H, W-pad*2, Math.max(1, k));
    g.textBaseline = 'top'; g.fillStyle = '#0b0b0b'; g.font = F(600, 13); g.fillText(t('extra'), pad, H + pad*0.8);
    rows.forEach((o,i)=>{ const x = pad + (i%cols)*colW, y = H + pad*0.8 + 24*k + Math.floor(i/cols)*lh2;
      g.font = F(600, 12); g.fillStyle = '#0b0b0b'; g.fillText(o.pos, x, y);
      g.font = F(400, 12); g.fillStyle = '#2b2b2b'; g.fillText(o.parts.join(' · '), x + 34*k, y); });
  }
  const url = cv.toDataURL('image/png'); [S.sel, S.sels] = prev; build();
  dialog({ html:`<p class="ttl">${t('capT')}</p><img src="${url}" alt="capture"><p class="hint">${t('capHint')}</p><p style="margin-top:16px"><a class="btn primary dl" href="${url}" download="flatpoint-dob.png">${t('down')}</a></p>` });
  mbox.querySelector('.ok').classList.remove('primary');   // 다운로드가 검정, 확인은 흰 버튼
  mbox.querySelector('.acts2').style.marginTop = '8px';
}

/* ⑬ 버튼 연결 */
document.getElementById('tFit').onclick = ()=>fit(false);
document.getElementById('tDelRow').onclick = delRow;
document.addEventListener('keydown', e=>{        // Ctrl(⌘)+Z 되돌리기 · Ctrl(⌘)+Shift+Z / Ctrl+Y 다시 실행
  if (PRESET || !(e.ctrlKey||e.metaKey) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || modal.classList.contains('show')) return;
  const k = e.key.toLowerCase();
  if (k==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if ((k==='z' && e.shiftKey) || k==='y'){ e.preventDefault(); redo(); }
});
document.addEventListener('keydown', e=>{        // 칸 선택 후 Backspace/Delete → 삭제
  if (PRESET || (e.key!=='Backspace' && e.key!=='Delete')) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || modal.classList.contains('show')) return;
  if (!S.sels.length) return; e.preventDefault();
  if (S.rows.length===1 && S.cols.length===1) return toast(t('lastCell'));
  const rs = uniq(S.sels.map(s=>s.r)), cs = uniq(S.sels.map(s=>s.c));
  const fullRows = rs.every(r=>S.cols.every((_,c)=>isSel(r,c))), fullCols = cs.every(c=>S.rows.every((_,r)=>isSel(r,c)));
  if (fullRows && !fullCols) delRow(); else if (fullCols && !fullRows) delCol();
  else if (S.rows.length===1) delCol(); else if (S.cols.length===1) delRow();
  else if (fullRows) delRow();
  else {                                           // 애매할 때: 가로줄/세로줄 중 고르기
    dialog({ html:`<p>${t('delWhich')}</p>`, cancel:true, onOk:delRow });
    const ok = mbox.querySelector('.ok'); ok.textContent = t('delRowB');
    const col = document.createElement('button'); col.type='button'; col.className='btn'; col.textContent = t('delColB');
    col.onclick = ()=>{ closeModal(); delCol(); }; ok.after(col);
  }
});
document.getElementById('tDelCol').onclick = delCol;
document.getElementById('tIn').onclick = ()=>zoom(.85);
document.getElementById('tOut').onclick = ()=>zoom(1.18);
document.getElementById('tClose').onclick = ()=>{ Object.values(S.open).forEach(o=>o.to = 0); };   // 모든 도어 닫기
document.getElementById('bLang').onclick = ()=>{ S.lang = S.lang==='ko'?'en':'ko'; document.documentElement.lang=S.lang; renderPanel(); };
document.getElementById('bHole').onclick = e=>{     // 타공 위치 보기 켜기/끄기 (닫힌 도어 위에 표시)
  S.showHoles = !S.showHoles; const b = e.currentTarget; b.classList.toggle('solid', S.showHoles); b.setAttribute('aria-pressed', S.showHoles);
  Object.keys(holeMarks).forEach(setDoor);
};
document.getElementById('bLight').onclick = e=>{    // 조명 위치 보기 켜기/끄기 (칸 오른쪽 위에 전구 + 색온도)
  S.showLights = !S.showLights; const b = e.currentTarget; b.classList.toggle('solid', S.showLights); b.setAttribute('aria-pressed', S.showLights);
  lightTags.forEach(s=>s.visible = S.showLights);
};
document.getElementById('bReset').onclick = ()=>dialog({ msg:t(PRESET?'modelReset':'resetQ'), cancel:true, onOk:()=>{ startState(); build(); renderPanel(); fit(true); } });
document.getElementById('bCap').onclick = capture;
document.getElementById('save').onclick = ()=> PRESET ? sendCart() : openSave();
if (PRESET){                                     // 기성 제품: 편집·저장 버튼 숨기고 [이미지 캡쳐] [장바구니 담기]로
  ['tDelRow','tDelCol','load','bLight'].forEach(id=>document.getElementById(id).style.display='none');
  document.querySelector('.ptop').style.display = 'none';
  const two = document.querySelector('#bottom .two'), cap = document.getElementById('bCap'), sv = document.getElementById('save');
  cap.classList.remove('primary'); sv.classList.add('primary'); two.prepend(cap); document.querySelector('#bottom').classList.add('one');
  document.title = 'DOB 옵션 시뮬레이터'; document.body.classList.add('preset');
}
document.getElementById('load').onclick = openLoad;
modal.addEventListener('click', e=>{ if (e.target===modal) closeModal(); });

/* ⑭ 시작 */
new ResizeObserver(()=>{ resize(); }).observe(viewer);
startState(); resize(); build(); renderPanel(); fit(true);
if (document.fonts) Promise.all(['300 64px Inter','500 64px Inter','400 12px "Pretendard KO"','600 12px "Pretendard KO"'].map(f=>document.fonts.load(f, f.includes('KO')?'가':'A'))).then(()=>build()).catch(()=>{});   // 치수 글꼴이 늦게 받아지면 다시 그림
window.DOB = { undo, redo, state:S, addAt, refresh, fit, camera, controls, PRESET, applyPreset, setRowDoor, toggleHole, sendCart };   // 점검용
document.getElementById('loading').remove();

const tClose = document.getElementById('tClose');
(function loop(){
  requestAnimationFrame(loop);
  Object.keys(S.open).forEach(k=>{ const o=S.open[k]; if (o.a===o.to) return; o.a += Math.sign(o.to-o.a)*0.02; if (Math.abs(o.to-o.a)<0.02) o.a=o.to; setDoor(k); });   // 약 0.8초
  const anyOpen = Object.values(S.open).some(o=>o.to>0 || o.a>0); if (tClose.disabled === anyOpen) tClose.disabled = !anyOpen;
  controls.update(); updateDimText(); renderer.render(scene, camera);
  if (S.sels.length){                           // 선택 외곽선 덧그리기
    renderer.setRenderTarget(maskRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(maskScene, camera);
    renderer.setRenderTarget(null); renderer.autoClear = false; renderer.render(edgeScene, edgeCam); renderer.autoClear = true;
  }
})();
}
</script>
